[project]
name = "timekeeper"
version = "0.1.0"
description = "Timekeeper - build the core meeting slides and summary csv from iLAB"
requires-python = ">=3.13"

dependencies = [
    "requests",
    "pandas",
    "python-dateutil",
    "python-pptx",
    "keyring",
]

[dependency-groups]
dev = [
    "pyinstaller",
]

[tool.uv]
package = false
# uv's own Python builds ship with Tkinter (not every system Python does)
python-preference = "only-managed"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
